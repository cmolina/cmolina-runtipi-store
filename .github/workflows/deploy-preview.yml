name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      PREVIEW_WORKER_URL: ${{ secrets.PREVIEW_WORKER_URL }}
      CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
      CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: apps
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- apps/ \
            | grep -oP '^apps/\K[^/]+' | sort -u | tr '\n' ' ')
          echo "list=${CHANGED}" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        if: steps.apps.outputs.list != ''
        env:
          PREVIEW_WORKER_URL: ${{ secrets.PREVIEW_WORKER_URL }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          missing=()
          [ -z "$PREVIEW_WORKER_URL" ] && missing+=(PREVIEW_WORKER_URL)
          [ -z "$CF_CLIENT_ID" ]       && missing+=(CF_CLIENT_ID)
          [ -z "$CF_CLIENT_SECRET" ]   && missing+=(CF_CLIENT_SECRET)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up QEMU (multi-arch builds)
        if: steps.apps.outputs.list != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.apps.outputs.list != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.apps.outputs.list != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push derived images
        if: steps.apps.outputs.list != ''
        run: |
          # Build + publish derived images (e.g. terminal/ wrappers) for changed
          # apps that declare a terminal/Dockerfile. Tags use the app version
          # from config.json so docker-compose.json image refs resolve.
          set -e
          BUILT=0
          for APP_ID in ${{ steps.apps.outputs.list }}; do
            DOCKERFILE="apps/$APP_ID/terminal/Dockerfile"
            [ -f "$DOCKERFILE" ] || continue
            VERSION=$(jq -r '.version' "apps/$APP_ID/config.json")
            echo "Building derived image for $APP_ID at $VERSION"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -t "ghcr.io/${{ github.repository_owner }}/$APP_ID-ttyd:$VERSION" \
              --push "apps/$APP_ID/terminal"
            BUILT=1
          done
          [ "$BUILT" = "1" ] || echo "No derived images to build"

      - name: Enqueue preview job with worker
        if: steps.apps.outputs.list != ''
        id: enqueue
        run: |
          # The worker (running on the Runtipi host) installs each app into the
          # pr-<number> store, copies production data directly from disk, starts
          # it, verifies HTTP 2xx, and sets GitHub deployment statuses itself.
          # We only enqueue here; Cloudflare Access gates the endpoint.
          BODY=$(jq -n \
            --argjson pr "${{ github.event.number }}" \
            --arg ref "${{ github.head_ref }}" \
            --arg apps "${{ steps.apps.outputs.list }}" \
            '{prNumber: $pr, ref: $ref, apps: ($apps | split(" ") | map(select(. != "")))}')
          RESP=$(curl -fsSL \
            -H "CF-Access-Client-Id: $CF_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_CLIENT_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$PREVIEW_WORKER_URL/preview")
          echo "Worker response: $RESP"
