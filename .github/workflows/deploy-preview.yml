name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    env:
      RUNTIPI_URL: ${{ secrets.RUNTIPI_URL }}
      CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
      CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: apps
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- apps/ \
            | grep -oP '^apps/\K[^/]+' | sort -u | tr '\n' ' ')
          echo "list=${CHANGED}" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        if: steps.apps.outputs.list != ''
        env:
          RUNTIPI_ADMIN: ${{ secrets.RUNTIPI_ADMIN }}
          RUNTIPI_PASSWORD: ${{ secrets.RUNTIPI_PASSWORD }}
          RUNTIPI_TOTP_SECRET: ${{ secrets.RUNTIPI_TOTP_SECRET }}
        run: |
          missing=()
          [ -z "$RUNTIPI_URL" ]        && missing+=(RUNTIPI_URL)
          [ -z "$CF_CLIENT_ID" ]       && missing+=(CF_CLIENT_ID)
          [ -z "$CF_CLIENT_SECRET" ]   && missing+=(CF_CLIENT_SECRET)
          [ -z "$RUNTIPI_ADMIN" ]      && missing+=(RUNTIPI_ADMIN)
          [ -z "$RUNTIPI_PASSWORD" ]   && missing+=(RUNTIPI_PASSWORD)
          [ -z "$RUNTIPI_TOTP_SECRET" ] && missing+=(RUNTIPI_TOTP_SECRET)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Setup and authenticate
        if: steps.apps.outputs.list != ''
        uses: ./.github/actions/runtipi-auth
        with:
          runtipi_url: ${{ secrets.RUNTIPI_URL }}
          cf_client_id: ${{ secrets.CF_CLIENT_ID }}
          cf_client_secret: ${{ secrets.CF_CLIENT_SECRET }}
          runtipi_admin: ${{ secrets.RUNTIPI_ADMIN }}
          runtipi_password: ${{ secrets.RUNTIPI_PASSWORD }}
          runtipi_totp_secret: ${{ secrets.RUNTIPI_TOTP_SECRET }}

      - name: Create and sync preview store
        if: steps.apps.outputs.list != ''
        run: |
          source /tmp/runtipi.sh
          STORE="pr-${{ github.event.number }}"
          BRANCH_URL="https://github.com/${{ github.repository }}/tree/${{ github.head_ref }}"
          CREATE_BODY=$(jq -n --arg name "$STORE" --arg url "$BRANCH_URL" '{name: $name, url: $url}')
          runtipi POST /api/marketplace/create -d "$CREATE_BODY" > /dev/null || true
          runtipi POST /api/marketplace/pull > /dev/null

      - name: Install apps
        if: steps.apps.outputs.list != ''
        id: install
        run: |
          source /tmp/runtipi.sh
          STORE="pr-${{ github.event.number }}"
          SUCCESS_APPS=""
          FAILED_APPS=""
          for APP_ID in ${{ steps.apps.outputs.list }}; do
            CONFIG="apps/$APP_ID/config.json"
            [ -f "$CONFIG" ] || continue
            URN="${APP_ID}:${STORE}"
            runtipi DELETE /api/app-lifecycle/$URN/uninstall -d '{"removeBackups":true}' > /dev/null || true
            sleep 10
            FORM=$(STORE="$STORE" python3 /tmp/gen_form.py "$CONFIG")
            runtipi POST /api/app-lifecycle/$URN/install -d "$FORM" > /tmp/install_resp
            INSTALL_RESP=$(cat /tmp/install_resp)
            INSTALL_CODE=$RUNTIPI_HTTP_CODE
            if [ "$INSTALL_CODE" = "200" ] || [ "$INSTALL_CODE" = "201" ]; then
              SUCCESS_APPS="$SUCCESS_APPS $APP_ID"
            else
              echo "::error::$APP_ID install failed (HTTP $INSTALL_CODE): $INSTALL_RESP"
              FAILED_APPS="$FAILED_APPS $APP_ID"
            fi
          done
          echo "success_apps=${SUCCESS_APPS# }" >> "$GITHUB_OUTPUT"
          echo "failed_apps=${FAILED_APPS# }" >> "$GITHUB_OUTPUT"

      - name: Create GitHub deployments
        if: steps.apps.outputs.list != ''
        uses: actions/github-script@v7
        env:
          SUCCESS_APPS: ${{ steps.install.outputs.success_apps }}
          FAILED_APPS: ${{ steps.install.outputs.failed_apps }}
        with:
          script: |
            const ref = context.payload.pull_request.head.ref;
            const storeSuffix = `pr-${context.payload.pull_request.number}`;
            const successApps = (process.env.SUCCESS_APPS || '').trim().split(/\s+/).filter(Boolean);
            const failedApps  = (process.env.FAILED_APPS  || '').trim().split(/\s+/).filter(Boolean);
            const deploy = async (appId, state) => {
              const { data: dep } = await github.rest.repos.createDeployment({
                ...context.repo,
                ref,
                environment: `preview/${appId}`,
                auto_merge: false,
                required_contexts: [],
                transient_environment: true,
                production_environment: false,
              });
              await github.rest.repos.createDeploymentStatus({
                ...context.repo,
                deployment_id: dep.id,
                state,
                ...(state === 'success' && {
                  environment_url: `https://${appId}-${storeSuffix}-preview.cmolina.cl`,
                }),
                log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            };
            for (const appId of successApps) await deploy(appId, 'success');
            for (const appId of failedApps)  await deploy(appId, 'failure');
