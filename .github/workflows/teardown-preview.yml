name: Teardown Preview

on:
  pull_request:
    types: [closed]

jobs:
  teardown:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    env:
      RUNTIPI_URL: ${{ secrets.RUNTIPI_URL }}
      CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
      CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: List apps from the PR branch
        id: apps
        run: |
          APPS=$(ls -d apps/*/ 2>/dev/null | sed 's|apps/||;s|/||' | tr '\n' ' ')
          echo "list=${APPS}" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        env:
          RUNTIPI_ADMIN: ${{ secrets.RUNTIPI_ADMIN }}
          RUNTIPI_PASSWORD: ${{ secrets.RUNTIPI_PASSWORD }}
          RUNTIPI_TOTP_SECRET: ${{ secrets.RUNTIPI_TOTP_SECRET }}
        run: |
          missing=()
          [ -z "$RUNTIPI_URL" ]        && missing+=(RUNTIPI_URL)
          [ -z "$CF_CLIENT_ID" ]       && missing+=(CF_CLIENT_ID)
          [ -z "$CF_CLIENT_SECRET" ]   && missing+=(CF_CLIENT_SECRET)
          [ -z "$RUNTIPI_ADMIN" ]      && missing+=(RUNTIPI_ADMIN)
          [ -z "$RUNTIPI_PASSWORD" ]   && missing+=(RUNTIPI_PASSWORD)
          [ -z "$RUNTIPI_TOTP_SECRET" ] && missing+=(RUNTIPI_TOTP_SECRET)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Setup and authenticate
        uses: ./.github/actions/runtipi-auth
        with:
          runtipi_url: ${{ secrets.RUNTIPI_URL }}
          cf_client_id: ${{ secrets.CF_CLIENT_ID }}
          cf_client_secret: ${{ secrets.CF_CLIENT_SECRET }}
          runtipi_admin: ${{ secrets.RUNTIPI_ADMIN }}
          runtipi_password: ${{ secrets.RUNTIPI_PASSWORD }}
          runtipi_totp_secret: ${{ secrets.RUNTIPI_TOTP_SECRET }}

      - name: Uninstall all apps from the preview store and remove it
        run: |
          source /tmp/runtipi.sh
          STORE="pr-${{ github.event.number }}"
          APPS="${{ steps.apps.outputs.list }}"

          if [ -n "$APPS" ]; then
            echo "Uninstalling apps from $STORE: $APPS"
            for APP_ID in $APPS; do
              runtipi DELETE "/api/app-lifecycle/${APP_ID}:${STORE}/uninstall" -d '{"removeBackups":true}' > /dev/null || true
            done
            for APP_ID in $APPS; do
              wait_for_app_status "${APP_ID}:${STORE}" "missing" 120 || true
            done
          else
            echo "No apps to uninstall"
          fi

          echo "Removing store $STORE"
          runtipi GET /api/marketplace/all > /tmp/runtipi_stores
          STORE_ID=$(jq -r --arg target "$STORE" '
            (if type == "object" then .data // .appStores // [] else . end) // []
            | map(select(.slug == $target or .name == $target))
            | first | .id // .slug // ""
          ' /tmp/runtipi_stores 2>/dev/null)
          if [ -n "$STORE_ID" ]; then
            runtipi DELETE "/api/marketplace/$STORE_ID" > /dev/null
            echo "Removed store $STORE (id=$STORE_ID)"
          else
            echo "Store $STORE not found, skipping"
          fi

      - name: Mark deployments inactive
        env:
          APPS_LIST: ${{ steps.apps.outputs.list }}
        uses: actions/github-script@v7
        with:
          script: |
            const apps = (process.env.APPS_LIST || '').trim().split(/\s+/).filter(Boolean);
            for (const appId of apps) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                ...context.repo,
                environment: `preview/${appId}`,
              });
              for (const dep of deployments) {
                await github.rest.repos.createDeploymentStatus({
                  ...context.repo,
                  deployment_id: dep.id,
                  state: 'inactive',
                });
              }
            }
