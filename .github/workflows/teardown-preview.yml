name: Teardown Preview

on:
  pull_request:
    types: [closed]
    paths:
      - 'apps/**'

jobs:
  teardown:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    env:
      RUNTIPI_URL: ${{ secrets.RUNTIPI_URL }}
      CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
      CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect apps in PR
        id: apps
        run: |
          CHANGED=$(git diff --name-only \
            ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            -- apps/ \
            | grep -oP '^apps/\K[^/]+' | sort -u | tr '\n' ' ')
          echo "list=${CHANGED}" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        if: steps.apps.outputs.list != ''
        env:
          RUNTIPI_URL: ${{ secrets.RUNTIPI_URL }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
          RUNTIPI_ADMIN: ${{ secrets.RUNTIPI_ADMIN }}
          RUNTIPI_PASSWORD: ${{ secrets.RUNTIPI_PASSWORD }}
          RUNTIPI_TOTP_SECRET: ${{ secrets.RUNTIPI_TOTP_SECRET }}
        run: |
          missing=()
          [ -z "$RUNTIPI_URL" ]        && missing+=(RUNTIPI_URL)
          [ -z "$CF_CLIENT_ID" ]       && missing+=(CF_CLIENT_ID)
          [ -z "$CF_CLIENT_SECRET" ]   && missing+=(CF_CLIENT_SECRET)
          [ -z "$RUNTIPI_ADMIN" ]      && missing+=(RUNTIPI_ADMIN)
          [ -z "$RUNTIPI_PASSWORD" ]   && missing+=(RUNTIPI_PASSWORD)
          [ -z "$RUNTIPI_TOTP_SECRET" ] && missing+=(RUNTIPI_TOTP_SECRET)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Setup and authenticate
        if: steps.apps.outputs.list != ''
        env:
          RUNTIPI_ADMIN: ${{ secrets.RUNTIPI_ADMIN }}
          RUNTIPI_PASSWORD: ${{ secrets.RUNTIPI_PASSWORD }}
          RUNTIPI_TOTP_SECRET: ${{ secrets.RUNTIPI_TOTP_SECRET }}
        run: |
          sudo apt-get install -y oathtool

          cat > /tmp/runtipi.sh << 'EOF'
          runtipi() {
            local method="$1" path="$2"
            shift 2
            local tmp body
            tmp=$(mktemp)
            RUNTIPI_HTTP_CODE=$(curl -sS -L \
              -b /tmp/jar -c /tmp/jar \
              -H "CF-Access-Client-Id: $CF_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_CLIENT_SECRET" \
              -H "Content-Type: application/json" \
              -X "$method" \
              "$@" \
              -o "$tmp" -w "%{http_code}" \
              "$RUNTIPI_URL$path")
            body=$(cat "$tmp"); rm -f "$tmp"
            echo "[$method $path] HTTP $RUNTIPI_HTTP_CODE $body" >&2
            echo "$body"
          }
          EOF

          source /tmp/runtipi.sh

          LOGIN=$(python3 -c "
          import json, os
          print(json.dumps({'username': os.environ['RUNTIPI_ADMIN'], 'password': os.environ['RUNTIPI_PASSWORD']}))
          ")
          runtipi POST /api/auth/login -d "$LOGIN" > /tmp/runtipi_login
          if ! python3 -c "import sys,json; json.loads(sys.stdin.read())" < /tmp/runtipi_login 2>/dev/null; then
            echo "::error::Login response is not JSON — Cloudflare Bot Fight Mode may be blocking this request"
            exit 1
          fi
          RESPONSE=$(cat /tmp/runtipi_login)
          TOTP_SESSION=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['totpSessionId'])")
          TOTP_CODE=$(oathtool --totp --base32 "$RUNTIPI_TOTP_SECRET")
          VERIFY=$(python3 -c "
          import json, sys
          print(json.dumps({'totpCode': sys.argv[1], 'totpSessionId': sys.argv[2]}))
          " "$TOTP_CODE" "$TOTP_SESSION")
          runtipi POST /api/auth/verify-totp -d "$VERIFY" > /dev/null

      - name: Uninstall apps and remove store
        if: steps.apps.outputs.list != ''
        run: |
          source /tmp/runtipi.sh
          STORE="pr-${{ github.event.number }}"

          for APP_ID in ${{ steps.apps.outputs.list }}; do
            runtipi POST /api/app-lifecycle/${APP_ID}:${STORE}/uninstall -d '{}' > /dev/null || true
          done

          runtipi GET /api/marketplace/all > /tmp/runtipi_stores
          STORE_ID=$(python3 -c "
          import json, sys
          stores = json.load(open('/tmp/runtipi_stores'))
          target = sys.argv[1]
          for s in (stores if isinstance(stores, list) else stores.get('data', [])):
              if s.get('slug') == target or s.get('name') == target:
                  print(s['id'])
                  break
          " "$STORE" 2>/dev/null || echo "")

          [ -n "$STORE_ID" ] && runtipi DELETE /api/marketplace/$STORE_ID > /dev/null || true

      - name: Mark deployments inactive
        if: steps.apps.outputs.list != ''
        uses: actions/github-script@v7
        with:
          script: |
            const apps = '${{ steps.apps.outputs.list }}'.trim().split(/\s+/).filter(Boolean);

            for (const appId of apps) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                ...context.repo,
                environment: `preview/${appId}`,
              });
              for (const dep of deployments) {
                await github.rest.repos.createDeploymentStatus({
                  ...context.repo,
                  deployment_id: dep.id,
                  state: 'inactive',
                });
              }
            }
