name: Teardown Preview

on:
  pull_request:
    types: [closed]

jobs:
  teardown:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    env:
      PREVIEW_WORKER_URL: ${{ secrets.PREVIEW_WORKER_URL }}
      CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
      CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: List apps from the PR branch
        id: apps
        run: |
          APPS=$(ls -d apps/*/ 2>/dev/null | sed 's|apps/||;s|/||' | tr '\n' ' ')
          echo "list=${APPS}" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        env:
          PREVIEW_WORKER_URL: ${{ secrets.PREVIEW_WORKER_URL }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          missing=()
          [ -z "$PREVIEW_WORKER_URL" ] && missing+=(PREVIEW_WORKER_URL)
          [ -z "$CF_CLIENT_ID" ]       && missing+=(CF_CLIENT_ID)
          [ -z "$CF_CLIENT_SECRET" ]   && missing+=(CF_CLIENT_SECRET)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Uninstall preview apps and remove store via worker
        run: |
          # The worker uninstalls every app in the pr-<number> store, removes the
          # store, and cleans up docker leftovers + on-disk dirs. Cloudflare
          # Access gates the endpoint.
          curl -fsSL \
            -X DELETE \
            -H "CF-Access-Client-Id: $CF_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_CLIENT_SECRET" \
            "$PREVIEW_WORKER_URL/preview/${{ github.event.number }}"

      - name: Mark deployments inactive
        env:
          APPS_LIST: ${{ steps.apps.outputs.list }}
        uses: actions/github-script@v7
        with:
          script: |
            const apps = (process.env.APPS_LIST || '').trim().split(/\s+/).filter(Boolean);
            for (const appId of apps) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                ...context.repo,
                environment: `preview/${appId}`,
              });
              for (const dep of deployments) {
                await github.rest.repos.createDeploymentStatus({
                  ...context.repo,
                  deployment_id: dep.id,
                  state: 'inactive',
                });
              }
            }
